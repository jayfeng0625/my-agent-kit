extra_files:
  subagents/poteto-agent.md: pstack/agents/poteto-agent.md
merge_guidance: |
  Claude Code port. Frontmatter: `name: poteto-mode` (identifier); the Cursor mode keys
  `mode`, `icon`, `color`, and `reminder` are dropped (Claude Code has no modes; user's
  choice). `disable-model-invocation: true` stays as upstream sets it.
  subagents/poteto-agent.md tracks pstack/agents/poteto-agent.md through extra_files.
  Local edits there: `background: true` for `is_background`, `general-purpose` for
  `generalPurpose`, and the SKILL.md paths (the subagent reads the file because Claude Code
  cannot preload a skill with disable-model-invocation). This repo drops setup-pstack, so nothing registers it in
  ~/.claude/agents/ until the user links it.
  Models: one model and optional effort per role entry (see setup-pstack); defaults `opus`
  for code, judgment, and prose, `hardest tasks` `fable`. Playbook delegates spawn
  `poteto-agent`, whose local frontmatter `model: opus`, `effort: high` (user's choice,
  2026-10-07) covers a spawn that passes neither. Role lines in ~/.claude/pstack-models.md,
  `inherit` for `auto`/`inherit-parent`. Task became Agent; AskQuestion became
  AskUserQuestion; Cursor's create-skill became Anthropic's skill-creator; `/loop` is
  Claude Code's (autonomous-run.md, bug-fix.md). Cursor's built-in babysit skill mentions are removed.
  cursor-team-kit's deslop, control-ui, and control-cli live in this repo as their own
  upstream skills, so "from cursor-team-kit" wording is dropped.
  No cloud workers (user's choice): Cursor cloud agents became background subagents in
  their own worktree; orchestrate's workers are local, restacks run one at a time, and the
  Cursor dashboard and cloud recovery steps are gone; multi-phase-plan lanes run in local
  worktrees; session-pickup drops cloud-agent URLs. Drop new cloud features the same way.
  Transcripts: ~/.claude/projects/<project>/<session-id>.jsonl and
  <session-id>/subagents/agent-<id>.jsonl. scripts/worktree-audit.sh searches the main
  checkout's and each worktree's project dirs. worktree-cleanup's example path is
  .claude/worktrees/x (Claude Code's default, code.claude.com/docs/en/worktrees); its
  ~/Library/Application Support/Cursor reclaim item stays.
  bug-fix.md's **tdd** reference resolves to mattpocock's tdd (pstack tdd is not ported).
  Upstream assumes pstack lives in the repo under work (`pstack/skills/...`, read with
  `git show origin/main:`). Here those become `<skills dir>/...`, the installed skills
  folder that multi-phase-plan step 4 defines, read from disk; autopilot-full and
  autopilot-stack re-read their playbook from the skill folder. check-plan.mjs's program
  marker `git show origin/main:` became `Re-read them at every tick` to match.
  Two path and routing edits from a 2026-10-07 retro: the Principles intro gives the leaf
  path (`principle-<name>/SKILL.md` beside `poteto-mode/`), since agents read
  `poteto-mode/principle-*/` and failed; and the poteto-agent rule also covers subagents
  that an invoked skill spawns without naming a type (simplify, code-review), after a user
  had to correct general-purpose simplify reviewers. poteto-agent.md's "sits beside it"
  sentence names the same leaf path.
  From the 0148b78 merge: the Principles intro keeps upstream's kebab-case naming rule and
  adds the leaf path. Upstream's "Match the model to the job" became "Match the effort to
  the job": steps move the Agent `effort` from the role line's effort (`high` when the line
  names none), and the fast-mode, `-fast` slug, and slug-family sentences are dropped since
  a spawn has no speed setting. Playbook lines "Pick each subagent's reasoning level and
  fast or standard speed" read "Pick each subagent's effort". poteto-agent.md's
  `~/.cursor/plugins/` search with the plugin.json version pick became a read of
  ~/.claude/skills/poteto-mode/SKILL.md, then the project's .claude/skills copy (installs may
  symlink into ~/.agents/skills); "Task spawn" became "Agent spawn". Orchestrate: the Agent
  schema field is `isolation`, workers stay local in worktrees, chain rebases run one at a
  time. autopilot-full's "Assume the VM dies" became "Assume the owner dies".
  scripts/check-plan.test.ts uses the same ported marker as check-plan.mjs. The scripts run
  under bun (`bun test` in scripts/), outside this repo's npm test and tsconfig; bun's
  auto-install leaves scripts/node_modules, which breaks upstream-diff.ts (ENOBUFS), so
  delete it before diffing.
