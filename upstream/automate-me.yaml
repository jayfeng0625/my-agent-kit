merge_guidance: |
  Claude Code port. Cursor's built-in `create-skill` became Anthropic's `skill-creator`
  (skill-creator plugin) throughout, including the description. Skill paths moved to
  .claude/skills/ and ~/.claude/skills/. Personal category folders
  (.claude/skills/<handle>/<handle>-mode/) were dropped: Claude Code discovers skills only at
  .claude/skills/<skill-name>/SKILL.md (code.claude.com/docs/en/skills, "Where skills live").
  AskQuestion became AskUserQuestion, which takes 2-4 options and `multiSelect`. Transcripts
  are ~/.claude/projects/<project>/<session-id>.jsonl.
  Upstream's "reasoning level and fast or standard speed" becomes "effort".
  The intro and step 5 add the **writing-for-agents** skill beside skill-creator (2026-10-18),
  since the user's global CLAUDE.md routes skill writing through it. Keep it on each merge.
