merge_guidance: |
  Claude Code port; keep each adaptation below on every merge.
  Cursor's `create-skill` becomes `skill-creator` (skill-creator plugin) throughout, including the
  description, and the intro and step 5 add the **writing-for-agents** skill beside it.
  Skill paths use .claude/skills/ and ~/.claude/skills/ with no personal category folders (Claude
  Code finds skills only at .claude/skills/<skill-name>/SKILL.md); transcripts live in
  ~/.claude/projects/<project>/<session-id>.jsonl.
  `AskQuestion` becomes `AskUserQuestion`, which takes 2-4 options and `multiSelect`.
  Upstream's "reasoning level and fast or standard speed" becomes "effort", per the Match the effort
  to the job rule in `~/.claude/references/mode-subagents.md` (upstream: poteto-mode's Subagents
  section).
  The shape example is impl-mode plus `~/.claude/references/mode-core.md` (upstream: poteto-mode).
