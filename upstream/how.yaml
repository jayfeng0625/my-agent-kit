merge_guidance: |
  Claude Code port. Role lines come from ~/.claude/pstack-models.md when the user has one (this repo drops setup-pstack).
  `how explorer` and `how explainer` default to `opus` (the user's choice); `inherit` replaces `auto` and `inherit-parent`; a
  rejected model runs on `inherit`. Task became the Agent tool, `generalPurpose` became
  `general-purpose`, and `readonly: true` became a brief that says the subagent edits no files. Upstream's
  "reasoning level and fast or standard speed" becomes "effort", and its slug-fallback
  sentence is dropped.
  Local User Proposal section in the explainer prompt carries the user's plan verbatim; the explainer judges it within the user's constraints and labels any orchestrator alternative.
  Simple path: the main thread explores and explains in one pass, with no explainer spawn. The complex path keeps upstream's explorers and explainer.
  This repo drops poteto-mode (2026-10-29): "per the Subagents section of the poteto-mode skill" becomes "per the Match the effort to the job rule in `~/.claude/references/mode-core.md`".
